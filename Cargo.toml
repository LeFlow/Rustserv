[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/helper"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Rustserv"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "fs", "io-util", "net"] }

[profile.release]
# Binaire plus petit : l'app doit rester légère.
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
